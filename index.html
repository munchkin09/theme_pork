<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Theme Park Tycoon - Phaser OOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="public/style.css" rel="stylesheet">
</head>
<body>

    <div id="game-container"></div>
    <div id="custom-tooltip"></div>

    <div id="ui-layer">
        <h3>Construcción</h3>
        <div id="build-menu"></div>
        <hr>
        <h3>Mejoras</h3>
        <div id="items-menu"></div>
        <hr>
        <div id="stats" class="info">Dinero: $1000</div>
        <div id="goal" class="info">Objetivo: $800</div>
        <div id="timer" class="info" style="font-size: 14px; font-weight: bold; color: #ffcc00; margin-top: 5px;">Tiempo: 2:00</div>
    </div>

    <div id="debug-panel" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 10px; font-family: monospace; font-size: 12px; max-height: 90vh; overflow-y: auto; border-radius: 8px; min-width: 250px;">
        <h3 style="margin-top: 0;">Debug Info</h3>
        <div id="debug-modifiers" style="margin-bottom: 10px;"></div>
        <table id="debug-entities" border="1" style="border-collapse: collapse; width: 100%; border-color: #555;">
            <thead>
                <tr style="background: #333;">
                    <th>Entidad</th>
                    <th>Pos</th>
                    <th>Base</th>
                    <th>Mod/Decay</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="game-console" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 600px; height: 150px; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; padding: 10px; overflow-y: auto; border-radius: 5px; border: 1px solid #333; pointer-events: none;">
        <div>> Sistema iniciado...</div>
    </div>


</body>
</html>
